<meta name="description" content="AMA 與臺大在 11/10 同一天把最終決定權與監督責任寫回醫師，CMS 讓臨床軟體第一次成為 Medicare 獨立給付科目，而 Doximity 調查顯示醫師日用率翻倍、四分之三的人遇過事實錯誤——11/9 至 11/15 本週回顧與延伸閱讀清單。">
<meta name="report-date" content="2026-11-15">
<meta name="report-theme" content="weekly-review">
<meta name="report-title-zh" content="本週有兩個醫師團體在同一天把最後決定權寫回醫師手上，而付錢與計分的規則同時換了算法——11/6–10 美國醫學會（AMA）在佛州年中會議通過政策，明定 AI 不得被授予醫師執照、專業職稱或執業認證，缺陷臨床 AI 造成的傷害責任應歸廠商、製造商或經銷商，醫師因不使用或不聽從 AI 建議不得被追究責任，並要求 AI 公司投保、揭露產品限制與效能數據、不得以合約把責任轉嫁給醫師或醫療系統；同一天 11/10 臺大醫院倫理中心公布《人工智慧、醫療與人文台北聲明》14 項原則草案，第 3 條明寫人機協作由醫師負監督責任，11/13 下午在第 38 屆世界內科醫學會議（11/12–15，南港展覽館二館）的邀請制全球論壇付諸討論，大會今天上午以「AI 時代之研究誠信與學術倫理」收尾。同一週 11/6 刊登的 CY2027 OPPS 終局規則把臨床軟體變成一個獨立給付科目 SaMS、新設狀態指標 O1，14 個純演算法檢驗碼被整批拉出臨床檢驗費表，81427 落在 APC 1522、2,250.50 美元，病人這一筆要自付約 450 美元。而把帳攤開的兩份數字互相打架：11/12 Doximity 對逾 3,300 名美國醫師的調查顯示，臨床決策支援用途從 2025 年的 37% 幾乎翻倍到 63%、七成用來查文獻、81% 說 AI 教了他們原本不知道的事，但四分之三的人過去一年至少遇過一次事實錯誤、超過半數把錯誤列為減少使用的主因；11/10 Google Cloud 推出 Gemini for healthcare 美國預覽，七家首發客戶包含 HCA、Northwell、Optum 與史丹佛醫學院，整份新聞稿沒有一個 benchmark 數字。">
<meta name="report-title-en" content="Two physician bodies wrote the final call back to the doctor on the same day this week, while the rules for paying and scoring changed underneath them — at its Interim Meeting in Florida on 11/6–10 the AMA adopted policy stating that AI cannot be granted physician licensure, professional titles or certification to practice medicine, that liability for harm from defective clinical AI belongs to vendors, manufacturers or distributors, that physicians must not be held liable for declining to use an AI tool or to follow its recommendation, and that AI companies should carry liability insurance, disclose limitations and performance data, and not shift responsibility onto physicians or health systems by contract; on the same 11/10, the ethics centre at National Taiwan University Hospital published the 14 draft principles of the Taipei Declaration on Artificial Intelligence, Medicine and Humanities, whose third principle puts the duty of supervision on the physician, and took them to an invitation-only global forum on the afternoon of 11/13 at the 38th World Congress of Internal Medicine (11/12–15, Taipei Nangang Exhibition Center Hall 2), which closes this morning on research integrity in the age of AI. The CY2027 OPPS final rule published on 11/6 turned clinical software into a separately payable Medicare category, SaMS, with a new status indicator O1, and pulled 14 algorithm-only laboratory codes off the clinical lab fee schedule — 81427 landing in APC 1522 at 2,250.50 dollars, leaving the patient roughly 450 dollars of coinsurance. Meanwhile the week's two sets of books disagree: a Doximity survey of more than 3,300 US physicians on 11/12 found clinical decision support use almost doubling from 37% in 2025 to 63%, 70% searching the literature with AI and 81% saying it taught them something they did not know — while three in four hit a factual inaccuracy at least once in the past year and more than half named inaccuracy as the main reason they cut back; and Google Cloud's Gemini for healthcare, in US preview from 11/10 with seven launch customers including HCA, Northwell, Optum and Stanford Medicine, shipped without a single benchmark number.">
<meta name="report-summary-zh" content="AMA 與臺大在 11/10 同一天把最終決定權與監督責任寫回醫師，CMS 讓臨床軟體第一次成為 Medicare 獨立給付科目，而 Doximity 調查顯示醫師日用率翻倍、四分之三的人遇過事實錯誤——11/9 至 11/15 本週回顧與延伸閱讀清單。">
<meta name="report-summary-en" content="The AMA and NTUH both wrote the final decision back to the physician on 11/10, CMS made clinical software a separately payable Medicare category for the first time, and a Doximity survey found daily physician use doubling while three in four hit factual errors — the week of 9 to 15 November reviewed, with a reading list.">
